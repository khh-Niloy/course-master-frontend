<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1FB67A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#17A06B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="40" height="40" rx="8" fill="url(#iconGradient)"/>
  
  <!-- Stacked books icon -->
  <g transform="translate(8, 10)">
    <!-- Bottom book (largest) -->
    <rect x="3" y="13" width="18" height="3" rx="1" fill="white" opacity="0.9"/>
    <!-- Middle book -->
    <rect x="5" y="9" width="18" height="3" rx="1" fill="white" opacity="0.95"/>
    <!-- Top book (smallest) -->
    <rect x="7" y="5" width="18" height="3" rx="1" fill="white"/>
    
    <!-- Page lines on top book -->
    <line x1="8" y1="6.5" x2="22" y2="6.5" stroke="#1FB67A" stroke-width="0.5" stroke-linecap="round"/>
    <line x1="8" y1="7.5" x2="22" y2="7.5" stroke="#1FB67A" stroke-width="0.5" stroke-linecap="round"/>
  </g>
</svg>


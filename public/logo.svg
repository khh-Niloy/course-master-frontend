<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1FB67A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#17A06B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="120" height="120" rx="20" fill="url(#logoGradient)"/>
  
  <!-- Stacked books icon -->
  <g transform="translate(25, 30)">
    <!-- Bottom book (largest) -->
    <rect x="10" y="40" width="50" height="10" rx="2" fill="white" opacity="0.9"/>
    <!-- Middle book -->
    <rect x="15" y="28" width="50" height="10" rx="2" fill="white" opacity="0.95"/>
    <!-- Top book (smallest) -->
    <rect x="20" y="16" width="50" height="10" rx="2" fill="white"/>
    
    <!-- Page lines on top book -->
    <line x1="25" y1="21" x2="65" y2="21" stroke="#1FB67A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="25" y1="24" x2="65" y2="24" stroke="#1FB67A" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>

